# RO-IPTV — ready-to-deploy stack.
#
# Pulls the prebuilt linux/amd64 image from GHCR — no build needed. For ARM
# hardware there is no published image: build from source with
# docker-compose.build.yml instead.
#
#   docker compose up -d        # start
#   docker compose pull && docker compose up -d   # update to the latest image
#
# To build the image from source instead, use docker-compose.build.yml.
# Values below can be overridden from a .env file (see .env.example).

services:
  ro-iptv:
    image: ghcr.io/aiulian25/ro-iptv:latest
    container_name: ro-iptv
    restart: unless-stopped

    ports:
      # host:container — open the app at http://<your-host>:56892
      - "${PORT:-56892}:${PORT:-56892}"

    environment:
      - PORT=${PORT:-56892}
      - DATA_DIR=/data
      # Timezone (affects the clock and EPG times).
      - TZ=${TZ:-Europe/London}

      # --- Authentication ---------------------------------------------------
      # Login is ON by default. The first sign-in uses admin / admin and then
      # FORCES you to set a new password (stored in the /data volume); the
      # default stops working afterwards. To run with NO login, set
      # AUTH_PASSWORD to an empty value.
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD-admin}
      - AUTH_SESSION_DAYS=${AUTH_SESSION_DAYS:-30}
      - RL_LOGIN_MAX=${RL_LOGIN_MAX:-10}
      - RL_WRITE_MAX=${RL_WRITE_MAX:-120}
      - RL_UPSTREAM_MAX=${RL_UPSTREAM_MAX:-120}
      - RATE_LIMIT_DISABLED=${RATE_LIMIT_DISABLED:-}
      - HSTS_MAX_AGE=${HSTS_MAX_AGE:-15552000}
      - AUTH_SESSION_SECRET=${AUTH_SESSION_SECRET:-}

      # --- Optional ---------------------------------------------------------
      # Auto-load a playlist / EPG on first start:
      - M3U_URL=${M3U_URL:-}
      - EPG_URL=${EPG_URL:-}
      - REFRESH_INTERVAL_MINUTES=${REFRESH_INTERVAL_MINUTES:-360}
      # Max length of a single recording, in minutes (auto-stops at the cap):
      - RECORDING_MAX_MINUTES=${RECORDING_MAX_MINUTES:-180}
      - RECORDING_MAX_CONCURRENT=${RECORDING_MAX_CONCURRENT:-4}
      - RECORDING_INPUT_IDLE_SECONDS=${RECORDING_INPUT_IDLE_SECONDS:-30}
      # Optional total-storage cap for recordings in GB (prunes oldest finished; blank = no cap):
      - RECORDINGS_MAX_GB=${RECORDINGS_MAX_GB:-}
      # Lock the API to specific origins (comma-separated host / host:port /
      # origin). Empty = allow any (the app is same-origin anyway):
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      # Set 1 to refuse proxy/playlist/EPG fetches to private/loopback addresses
      # (SSRF hardening). Leave blank if you use LAN IPTV sources:
      - PROXY_BLOCK_PRIVATE=${PROXY_BLOCK_PRIVATE:-}
      - PROXY_ALLOWED_CIDRS=${PROXY_ALLOWED_CIDRS:-}
      # Reverse-proxy hops to trust for the client IP and HTTPS detection.
      # Empty = trust none. Set 1 when a TLS proxy sits in front.
      - TRUST_PROXY=${TRUST_PROXY:-}
      # Off unless explicitly enabled. The EPG overlay enables and starts it.
      - EPG_SIDECAR_ENABLED=${EPG_SIDECAR_ENABLED:-0}
      - EPG_SIDECAR_URL=${EPG_SIDECAR_URL:-}
      # A country EPG pack is ~13 MB gzipped but ~72 MB of XML, and parsing it
      # peaks near 900 MB. Node only claims ~half the cgroup limit by default,
      # so the ceiling is set explicitly and the limit sized to fit it.
      - NODE_OPTIONS=--max-old-space-size=${NODE_HEAP_MB:-1536}

    volumes:
      # Playlists, recordings (and their files) and the auth credential.
      # Persists across container updates.
      - data:/data

    # --- Hardening (safe defaults; remove a line if your platform objects) ---
    init: true                       # proper PID 1 — reaps ffmpeg children
    read_only: true                  # immutable root FS; only /data + /tmp write
    tmpfs:
      - /tmp
    cap_drop:
      - ALL                          # the app needs no Linux capabilities
    security_opt:
      - no-new-privileges:true
    # Resource ceilings, matching docker-compose.build.yml. NODE_HEAP_MB below sets
    # node's heap to 1536 MB, which only bounds the JS heap — without a cgroup limit
    # around it a runaway parse or ffmpeg fan-out could still take the host with it.
    mem_limit: ${MEM_LIMIT:-2g}
    cpus: ${CPU_LIMIT:-2}
    pids_limit: ${PIDS_LIMIT:-256}
    ulimits:
      nofile:
        soft: ${NOFILE_SOFT:-4096}
        hard: ${NOFILE_HARD:-8192}

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-56892}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Without this the first probe only runs after `interval`, so anything
      # waiting on service_healthy (the EPG sidecar) stalls or gives up.
      start_period: 15s

    logging:                         # cap log growth so it can't fill the disk
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
    driver: local
