# RO-IPTV — ready-to-deploy stack.
#
# Pulls the prebuilt MULTI-ARCH image (linux/amd64 + linux/arm64) from GHCR — no
# build needed. The right image for your hardware (PC, mini-PC, Synology, ARM
# board, server) is selected automatically.
#
#   docker compose up -d        # start
#   docker compose pull && docker compose up -d   # update to the latest image
#
# To build the image from source instead, use docker-compose.build.yml.
# Values below can be overridden from a .env file (see .env.example).

services:
  ro-iptv:
    image: ghcr.io/aiulian25/ro-iptv:latest
    container_name: ro-iptv
    restart: unless-stopped

    ports:
      # host:container — open the app at http://<your-host>:56892
      - "56892:56892"

    environment:
      # Timezone (affects the clock and EPG times).
      - TZ=${TZ:-Europe/London}

      # --- Authentication ---------------------------------------------------
      # Login is ON by default. The first sign-in uses admin / admin and then
      # FORCES you to set a new password (stored in the /data volume); the
      # default stops working afterwards. To run with NO login, set
      # AUTH_PASSWORD to an empty value.
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-admin}
      - AUTH_SESSION_DAYS=${AUTH_SESSION_DAYS:-30}

      # --- Optional ---------------------------------------------------------
      # Auto-load a playlist / EPG on first start:
      - M3U_URL=${M3U_URL:-}
      - EPG_URL=${EPG_URL:-}
      - REFRESH_INTERVAL_MINUTES=${REFRESH_INTERVAL_MINUTES:-360}
      # Max length of a single recording, in minutes (auto-stops at the cap):
      - RECORDING_MAX_MINUTES=${RECORDING_MAX_MINUTES:-180}
      # Optional total-storage cap for recordings in GB (prunes oldest finished; blank = no cap):
      - RECORDINGS_MAX_GB=${RECORDINGS_MAX_GB:-}
      # Lock the API to specific origins (comma-separated host / host:port /
      # origin). Empty = allow any (the app is same-origin anyway):
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      # Set 1 to refuse proxy/playlist/EPG fetches to private/loopback addresses
      # (SSRF hardening). Leave blank if you use LAN IPTV sources:
      - PROXY_BLOCK_PRIVATE=${PROXY_BLOCK_PRIVATE:-}
      # Points at the optional grabber below. Harmless when it is not running.
      - EPG_SIDECAR_URL=${EPG_SIDECAR_URL:-http://epg:3000/guide.xml}
      # A country EPG pack is ~13 MB gzipped but ~72 MB of XML, and parsing it
      # peaks near 900 MB. Node only claims ~half the cgroup limit by default,
      # so the ceiling is set explicitly and the limit sized to fit it.
      - NODE_OPTIONS=--max-old-space-size=${NODE_HEAP_MB:-1536}

    volumes:
      # Playlists, recordings (and their files) and the auth credential.
      # Persists across container updates.
      - data:/data

    # --- Hardening (safe defaults; remove a line if your platform objects) ---
    init: true                       # proper PID 1 — reaps ffmpeg children
    read_only: true                  # immutable root FS; only /data + /tmp write
    tmpfs:
      - /tmp
    cap_drop:
      - ALL                          # the app needs no Linux capabilities
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:56892/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Without this the first probe only runs after `interval`, so anything
      # waiting on service_healthy (the EPG sidecar) stalls or gives up.
      start_period: 15s

    logging:                         # cap log growth so it can't fill the disk
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  epg:
    image: ghcr.io/iptv-org/epg:master
    # Opt-in: only starts with `docker compose --profile epg up -d`.
    profiles: ["epg"]
    container_name: ro-iptv-epg
    restart: unless-stopped
    # The channel list below is mounted from the app's volume, and a mount of a
    # path that does not exist yet stops this container starting. The app creates
    # the file as soon as it boots, so wait for it to be up before mounting.
    depends_on:
      ro-iptv:
        condition: service_healthy
    environment:
      # REQUIRED. The grabber allocates several GB while it loads the iptv-org
      # dataset, before it fetches anything; with node's default ceiling (~4 GB)
      # it dies with "JavaScript heap out of memory" no matter how few channels
      # are listed. Steady state afterwards is ~110 MB.
      - NODE_OPTIONS=--max-old-space-size=${EPG_HEAP_MB:-8192}
      # Nightly at 03:00. The grab takes a while — it scrapes one site at a time.
      - CRON_SCHEDULE=${EPG_CRON_SCHEDULE:-0 3 * * *}
      # How many days ahead to grab. 3 covers Now/Next plus the guide grid.
      - DAYS=${EPG_DAYS:-3}
      # The image default. Raising it multiplies the peak memory above.
      - MAX_CONNECTIONS=${EPG_MAX_CONNECTIONS:-1}
      - GZIP=true
      # Grab once on start so a fresh stack has a guide without waiting for cron.
      - RUN_AT_STARTUP=true
      - TZ=${TZ:-Europe/London}
    volumes:
      # The app-generated channel list, mounted as the grabber's input.
      - type: volume
        source: data
        target: /epg/public/channels.xml
        volume:
          subpath: epg/channels.xml
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
    driver: local
