# Explicit opt-in overlay. Use after either base manifest:
# docker compose -f docker-compose.yml -f docker-compose.epg.yml up -d
services:
  ro-iptv:
    environment:
      EPG_SIDECAR_ENABLED: "1"
      EPG_SIDECAR_URL: ${EPG_SIDECAR_URL:-http://epg:3000/guide.xml}

  epg:
    # Pinned by digest, as the Dockerfile pins its Node base. `:master` is a
    # floating tag: it moved on 2026-11-05 and shipped a layout the startup
    # command could not use, breaking the sidecar without anything here
    # changing. To update deliberately:
    #   docker buildx imagetools inspect ghcr.io/iptv-org/epg:master
    # then replace the digest below and recreate the sidecar.
    image: ghcr.io/iptv-org/epg:master@sha256:bac999d7d651bd50abb1ced4829bfbdc5846018fab1b254e2ab617a8299a9ebe
    container_name: ro-iptv-epg
    restart: unless-stopped
    # The channel list below is mounted from the app's volume, and a mount of a
    # path that does not exist yet stops this container starting. The app creates
    # the file as soon as it boots, so wait for it to be up before mounting.
    depends_on:
      ro-iptv:
        condition: service_healthy
    environment:
      # REQUIRED. The grabber allocates several GB while it loads the iptv-org
      # dataset, before it fetches anything; with node's default ceiling (~4 GB)
      # it dies with "JavaScript heap out of memory" no matter how few channels
      # are listed. Steady state afterwards is ~110 MB.
      - NODE_OPTIONS=--max-old-space-size=${EPG_HEAP_MB:-8192}
      # Nightly at 03:00. The grab takes a while — it scrapes one site at a time.
      - CRON_SCHEDULE=${EPG_CRON_SCHEDULE:-0 3 * * *}
      # How many days ahead to grab. 3 covers Now/Next plus the guide grid.
      - DAYS=${EPG_DAYS:-3}
      # The image default. Raising it multiplies the peak memory above.
      - MAX_CONNECTIONS=${EPG_MAX_CONNECTIONS:-1}
      - GZIP=true
      # Grab once on start so a fresh stack has a guide without waiting for cron.
      - RUN_AT_STARTUP=true
      - TZ=${TZ:-Europe/London}
    # Mount the directory so atomic channels.xml replacements stay visible.
    # Only the input file is linked into the served public directory.
    command:
      - /bin/sh
      - -ec
      - |
        # The image's own Dockerfile runs `mkdir /public`, but pm2.config.js reads
        # `public/channels.xml` relative to WORKDIR=/epg — so the directory the
        # grabber actually uses is missing from a fresh :master pull, and both the
        # symlink and the grab fail. Create it before linking.
        mkdir -p /epg/public
        ln -sfn /run/ro-iptv-epg-input/channels.xml /epg/public/channels.xml
        exec pm2-runtime pm2.config.js
    volumes:
      - type: volume
        source: data
        target: /run/ro-iptv-epg-input
        read_only: true
        volume:
          subpath: epg
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

